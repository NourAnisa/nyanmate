[package]
name = "nyanmate"
version = "0.26.0"
description = "NyanMate AI desktop companion"
authors = ["NourAnisa"]
edition = "2021"

[lib]
name = "nyanmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
